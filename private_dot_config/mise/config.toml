[tools]
actionlint = "latest"
atlas = "latest"
aws = { version = "latest", symlink_bins = "true" }
btop = "1.4.7"
bun = "latest"
fzf = "latest"
gdu = "latest"
github-cli = { version = "latest", postinstall = "gh auth setup-git" }
"github:bitwarden/sdk-sm" = { version = "latest", version_prefix = "bws-v" }
go = "1"
"go:github.com/sqlc-dev/sqlc/cmd/sqlc" = "latest"
golangci-lint = "latest"
gradle = "latest"
java = "corretto-17"
maven = "latest"
node = "26"
postgres = "17"
pre-commit = "latest"
pulumi = "latest"
python = "latest"
rclone = "latest"
ripgrep = "latest"
usage = "latest"
uv = "latest"
act = "latest"
lazygit = "latest"
"pipx:visidata" = { version = "latest", uvx_args = "--with openpyxl" }
# Harlequin PR #977: Vim editor support, pinned to the reviewed PR head.
"pipx:Dking08/harlequin" = { version = "9755dc4427654235260e6e5638da6f97791fc11e", extras = "postgres", uvx_args = "--python 3.14", postinstall = '"$MISE_TOOL_INSTALL_PATH/harlequin/bin/python" "$HOME/.config/mise/hooks/harlequin-steady-cursor.py" && "$MISE_TOOL_INSTALL_PATH/harlequin/bin/python" "$HOME/.config/mise/hooks/harlequin-column-jump.py" && mkdir -p "$HOME/.config/fish/completions" && env _HARLEQUIN_COMPLETE=fish_source harlequin > "$HOME/.config/fish/completions/harlequin.fish"' }
ffmpeg = "latest"
chezmoi = "latest"
amazon-ecr-credential-helper = "latest"
starship = "latest"
eza = "latest"
neovim = "latest"
"go:github.com/go-delve/delve/cmd/dlv" = "1"
rust = { version = "latest", components = "rust-analyzer,rust-src" }
bitwarden = "latest"
tmux = "latest"
caddy = "latest"
"go:github.com/jay-babu/bare" = "1.0.2"
yq = "latest"
jq = "latest"
"pipx:nano-pdf" = "latest"
"cargo:himalaya" = "latest"
"npm:@googleworkspace/cli" = "latest"
"go:github.com/air-verse/air" = "latest"
"go:github.com/charmbracelet/glow/v2" = "latest"
perl = "latest"
"go:golang.org/x/tools/gopls" = "latest"
"pipx:pyright" = "latest"
"pipx:mypy" = "latest"
"npm:typescript-language-server" = "latest"
"npm:yaml-language-server" = "latest"
"github:LuaLS/lua-language-server" = "latest"
"npm:dockerfile-language-server-nodejs" = "latest"
"npm:vercel" = "latest"
"npm:@postgrestools/postgrestools" = "latest"
ghcup = "latest"
"go:filippo.io/age/cmd/..." = "latest"
"http:kotlin-lsp" = { version = "262.9593.0", url = "https://download-cdn.jetbrains.com/language-server/kotlin-server/{{ version }}/kotlin-server-{{ version }}.tar.gz" }
"npm:@earendil-works/pi-coding-agent" = "latest"
fd = "latest"
"npm:@openai/codex" = "latest"
prek = "latest"

# Wrap the selected Codex version, including after mise upgrades.
[wrappers.codex]
command = "/root/.config/mise/wrappers/codex-bws"
